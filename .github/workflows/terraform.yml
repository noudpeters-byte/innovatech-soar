name: SOAR CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: python -m pip install -q pyyaml pytest boto3 psycopg2-binary
      - name: Unit tests
        working-directory: soar
        run: python -m pytest tests -q

  terraform:
    runs-on: self-hosted
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        working-directory: terraform
        run: terraform fmt -check
      - name: Init and validate
        working-directory: terraform
        run: |
          terraform init
          terraform validate
      - name: Plan
        working-directory: terraform
        run: terraform plan -no-color -input=false -out=tfplan
